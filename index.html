<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二维码·星巴克批量识别</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .security-notice {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
            padding: 15px;
            margin: 20px;
            border-radius: 8px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .security-icon {
            font-size: 20px;
        }

        .content {
            padding: 30px;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            background: #f8f9ff;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f2ff;
        }

        .upload-area.dragging {
            border-color: #764ba2;
            background: #e8ebff;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 3rem;
            color: #667eea;
            margin-bottom: 20px;
        }

        .upload-text {
            font-size: 1.2rem;
            color: #333;
            margin-bottom: 10px;
        }

        .upload-hint {
            font-size: 0.9rem;
            color: #666;
        }

        input[type="file"] {
            display: none;
        }

        .file-list {
            margin-top: 30px;
        }

        .file-item {
            display: flex;
            align-items: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid #e9ecef;
        }

        .file-preview {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 5px;
            margin-right: 15px;
            border: 1px solid #ddd;
        }

        .file-info {
            flex: 1;
        }

        .file-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .file-status {
            font-size: 0.9rem;
            color: #666;
        }

        .file-status.success {
            color: #28a745;
        }

        .file-status.error {
            color: #dc3545;
        }

        .file-status.processing {
            color: #ffc107;
        }

        .remove-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.3s ease;
        }

        .remove-btn:hover {
            background: #c82333;
        }

        .actions {
            margin: 30px 0;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover {
            background: #218838;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .results {
            margin-top: 30px;
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            border: 1px solid #e9ecef;
        }

        .results h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.3rem;
        }

        .result-text {
            background: white;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 15px;
            min-height: 100px;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: 'Courier New', monospace;
            line-height: 1.6;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .empty-state-icon {
            font-size: 3rem;
            color: #ccc;
            margin-bottom: 15px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e9ecef;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 4px;
            transition: width 0.3s ease;
            width: 0%;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .stat-item {
            background: white;
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid #e9ecef;
            text-align: center;
            flex: 1;
            min-width: 120px;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #666;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #333;
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transform: translateX(400px);
            transition: transform 0.3s ease;
            z-index: 1000;
            max-width: 300px;
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast.success {
            background: #28a745;
        }

        .toast.error {
            background: #dc3545;
        }

        .toast.info {
            background: #17a2b8;
        }

        .library-status {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 14px;
        }

        .library-status.loading {
            background: #fff3cd;
            border-color: #ffeaa7;
            color: #856404;
        }

        .library-status.success {
            background: #d4edda;
            border-color: #c3e6cb;
            color: #155724;
        }

        .library-status.error {
            background: #f8d7da;
            border-color: #f5c6cb;
            color: #721c24;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }
            
            .content {
                padding: 20px;
            }
            
            .upload-area {
                padding: 30px 20px;
            }
            
            .actions {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⭐</h1>
            <a href='https://vip.napt.cn' style='color: white; text-decoration:none;'>返回主页</a>
        </div>
        
        <div class="security-notice">
            <span class="security-icon">🔒</span>
            <div>
                <strong>安全提示：</strong>可离线断网使用
            </div>
        </div>
        
        <div class="content">
            <div class="library-status success">
                ✅ jsQR库已加载本地版本 (jsQR.js v1.4.0)
            </div>

            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📤</div>
                <div class="upload-text">点击选择图片或拖拽到此处</div>
                <div class="upload-hint">支持 JPG、PNG、GIF、BMP 等格式 · 可分多次选择累加</div>
                <input type="file" id="fileInput" multiple>
            </div>

            <div class="stats" id="stats" style="display: none;">
                <div class="stat-item">
                    <div class="stat-value" id="totalFiles">0</div>
                    <div class="stat-label">总文件数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="processedFiles">0</div>
                    <div class="stat-label">已处理</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="successFiles">0</div>
                    <div class="stat-label">识别成功</div>
                </div>
            </div>

            <div class="actions" id="actions" style="display: none;">
                <button class="btn btn-primary" id="processBtn">开始识别</button>
                <button class="btn btn-secondary" id="clearBtn">清空列表</button>
                <button class="btn btn-success" id="copyBtn" disabled>复制所有结果</button>
            </div>

            <div class="progress-bar" id="progressBar" style="display: none;">
                <div class="progress-fill" id="progressFill"></div>
            </div>

            <div class="file-list" id="fileList"></div>

            <div class="results" id="results" style="display: none;">
                <h3>📋 识别结果</h3>
                <div class="result-text" id="resultText"></div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <!-- 引入本地的jsQR库 -->
    <script src="jsQR.js"></script>
    
    <script>
        class QRReader {
            constructor() {
                this.files = [];
                this.processResults = [];
                this.libraryReady = false;
                this.initElements();
                this.bindEvents();
                this.checkLibraryStatus();
            }

            initElements() {
                this.uploadArea = document.getElementById('uploadArea');
                this.fileInput = document.getElementById('fileInput');
                this.fileList = document.getElementById('fileList');
                this.resultText = document.getElementById('resultText');
                this.resultsDiv = document.getElementById('results');
                this.processBtn = document.getElementById('processBtn');
                this.clearBtn = document.getElementById('clearBtn');
                this.copyBtn = document.getElementById('copyBtn');
                this.stats = document.getElementById('stats');
                this.actions = document.getElementById('actions');
                this.progressBar = document.getElementById('progressBar');
                this.progressFill = document.getElementById('progressFill');
                this.totalFiles = document.getElementById('totalFiles');
                this.processedFiles = document.getElementById('processedFiles');
                this.successFiles = document.getElementById('successFiles');
            }

            bindEvents() {
                this.uploadArea.addEventListener('click', () => {
                    this.fileInput.click();
                });

                this.fileInput.addEventListener('change', (e) => {
                    this.handleFiles(e.target.files);
                    // 处理完后清空 value，允许再次选择相同文件并触发 change 事件
                    // 这样即使浏览器只支持单选，用户也能通过多次点击累加多张图片
                    this.fileInput.value = '';
                });

                this.uploadArea.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    this.uploadArea.classList.add('dragging');
                });

                this.uploadArea.addEventListener('dragleave', () => {
                    this.uploadArea.classList.remove('dragging');
                });

                this.uploadArea.addEventListener('drop', (e) => {
                    e.preventDefault();
                    this.uploadArea.classList.remove('dragging');
                    this.handleFiles(e.dataTransfer.files);
                });

                this.processBtn.addEventListener('click', () => this.processFiles());
                this.clearBtn.addEventListener('click', () => this.clearFiles());
                this.copyBtn.addEventListener('click', () => this.copyResults());
            }

            checkLibraryStatus() {
                // 检查本地jsQR库是否加载成功
                setTimeout(() => {
                    if (typeof jsQR !== 'undefined') {
                        this.libraryReady = true;
                        console.log('jsQR库加载成功，版本信息:', typeof jsQR);
                    } else {
                        this.libraryReady = false;
                        console.error('jsQR库加载失败');
                        this.showToast('jsQR库加载失败，请确保jsQR.js文件在同一目录下', 'error');
                    }
                }, 100);
            }

            handleFiles(fileList) {
                Array.from(fileList).forEach(file => {
                    if (file.type.startsWith('image/')) {
                        const fileId = Date.now() + Math.random();
                        this.files.push({
                            id: fileId,
                            file: file,
                            name: file.name,
                            status: 'pending',
                            result: null
                        });
                    }
                });
                
                this.updateFileList();
                this.showStats();
            }

            updateFileList() {
                this.fileList.innerHTML = '';
                
                this.files.forEach((fileItem, index) => {
                    const fileDiv = document.createElement('div');
                    fileDiv.className = 'file-item';
                    
                    const preview = URL.createObjectURL(fileItem.file);
                    
                    let statusText = '等待处理';
                    let statusClass = '';
                    
                    if (fileItem.status === 'processing') {
                        statusText = '处理中...';
                        statusClass = 'processing';
                    } else if (fileItem.status === 'success') {
                        statusText = '识别成功';
                        statusClass = 'success';
                    } else if (fileItem.status === 'error') {
                        statusText = '识别失败';
                        statusClass = 'error';
                    }
                    
                    fileDiv.innerHTML = `
                        <img src="${preview}" alt="${fileItem.name}" class="file-preview">
                        <div class="file-info">
                            <div class="file-name">${fileItem.name}</div>
                            <div class="file-status ${statusClass}">${statusText}</div>
                        </div>
                        <button class="remove-btn" onclick="qrReader.removeFile(${fileItem.id})">删除</button>
                    `;
                    
                    this.fileList.appendChild(fileDiv);
                });

                if (this.files.length > 0) {
                    this.actions.style.display = 'flex';
                    this.stats.style.display = 'flex';
                } else {
                    this.actions.style.display = 'none';
                    this.stats.style.display = 'none';
                }
            }

            showStats() {
                this.totalFiles.textContent = this.files.length;
                this.processedFiles.textContent = this.files.filter(f => f.status !== 'pending').length;
                this.successFiles.textContent = this.files.filter(f => f.status === 'success').length;
            }

            async processFiles() {
                if (this.files.length === 0) {
                    this.showToast('请先上传图片', 'error');
                    return;
                }

                if (!this.libraryReady) {
                    this.showToast('jsQR库未加载，请检查jsQR.js文件是否存在', 'error');
                    return;
                }

                this.processBtn.disabled = true;
                this.progressBar.style.display = 'block';
                this.processResults = [];
                this.resultText.innerHTML = '';
                this.resultsDiv.style.display = 'block';

                const totalFiles = this.files.length;
                let processedCount = 0;

                for (let i = 0; i < this.files.length; i++) {
                    const fileItem = this.files[i];
                    fileItem.status = 'processing';
                    this.updateFileList();
                    
                    try {
                        const result = await this.processImage(fileItem.file, i + 1);
                        fileItem.result = result;
                        fileItem.status = result ? 'success' : 'error';
                        
                        if (result) {
                            this.processResults.push({
                                index: i + 1,
                                fileName: fileItem.name,
                                content: result
                            });
                        }
                    } catch (error) {
                        fileItem.status = 'error';
                        console.error('处理图片失败:', error);
                    }
                    
                    processedCount++;
                    const progress = (processedCount / totalFiles) * 100;
                    this.progressFill.style.width = progress + '%';
                    
                    this.updateFileList();
                    this.showStats();
                    this.updateResults();
                }

                this.processBtn.disabled = false;
                this.progressBar.style.display = 'none';
                
                if (this.processResults.length > 0) {
                    this.copyBtn.disabled = false;
                    this.showToast(`成功识别 ${this.processResults.length} 个二维码`, 'success');
                } else {
                    this.showToast('未识别到任何二维码', 'error');
                }
            }

            async processImage(file, index) {
                return new Promise((resolve) => {
                    console.log('开始处理图片:', file.name, '索引:', index);
                    
                    const img = new Image();
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    img.onload = () => {
                        try {
                            console.log('图片加载成功，尺寸:', img.width, 'x', img.height);
                            
                            // 调整图像大小以提高识别成功率
                            const maxSize = 1000;
                            let width = img.width;
                            let height = img.height;
                            
                            if (width > maxSize || height > maxSize) {
                                if (width > height) {
                                    height = (height * maxSize) / width;
                                    width = maxSize;
                                } else {
                                    width = (width * maxSize) / height;
                                    height = maxSize;
                                }
                            }
                            
                            canvas.width = width;
                            canvas.height = height;
                            ctx.drawImage(img, 0, 0, width, height);
                            
                            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                            console.log('获取图像数据成功，尺寸:', canvas.width, 'x', canvas.height);
                            
                            // 使用本地jsQR库进行识别
                            const code = jsQR(imageData.data, imageData.width, imageData.height, {
                                inversionAttempts: "dontInvert",
                            });
                            
                            if (code) {
                                console.log('识别成功:', code.data);
                                resolve(code.data);
                            } else {
                                console.log('未识别到二维码，尝试增强图像...');
                                // 尝试图像增强
                                const enhancedResult = this.tryEnhancedRecognition(ctx, canvas);
                                resolve(enhancedResult);
                            }
                        } catch (error) {
                            console.error('处理图片时出错:', error);
                            resolve(null);
                        } finally {
                            URL.revokeObjectURL(img.src);
                        }
                    };
                    
                    img.onerror = (error) => {
                        console.error('图片加载失败:', error);
                        resolve(null);
                    };
                    
                    img.src = URL.createObjectURL(file);
                });
            }

            tryEnhancedRecognition(ctx, canvas) {
                try {
                    // 增强对比度
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const data = imageData.data;
                    
                    for (let i = 0; i < data.length; i += 4) {
                        const gray = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114;
                        const threshold = gray > 128 ? 255 : 0;
                        data[i] = data[i + 1] = data[i + 2] = threshold;
                    }
                    
                    ctx.putImageData(imageData, 0, 0);
                    
                    // 再次尝试识别
                    const enhancedData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const code = jsQR(enhancedData.data, enhancedData.width, enhancedData.height, {
                        inversionAttempts: "attemptBoth",
                    });
                    
                    if (code) {
                        console.log('增强后识别成功:', code.data);
                        return code.data;
                    }
                } catch (error) {
                    console.error('增强识别失败:', error);
                }
                
                return null;
            }

            updateResults() {
                if (this.processResults.length === 0) {
                    this.resultText.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🔍</div>暂无识别结果</div>';
                    this.copyBtn.disabled = true;
                } else {
                    let text = '';
                    this.processResults.forEach(result => {
                        text += `${result.content}\n`;
                    });
                    this.resultText.textContent = text.trim();
                    this.copyBtn.disabled = false;
                }
            }

            removeFile(fileId) {
                this.files = this.files.filter(f => f.id !== fileId);
                this.processResults = this.processResults.filter(r => {
                    const fileItem = this.files.find(f => f.name === r.fileName);
                    return fileItem && fileItem.status === 'success';
                });
                this.updateFileList();
                this.showStats();
                this.updateResults();
            }

            clearFiles() {
                this.files = [];
                this.processResults = [];
                this.fileInput.value = '';
                this.updateFileList();
                this.showStats();
                this.resultsDiv.style.display = 'none';
                this.resultText.innerHTML = '';
                this.copyBtn.disabled = true;
                this.showToast('已清空文件列表', 'info');
            }

            async copyResults() {
                if (this.processResults.length === 0) {
                    this.showToast('没有可复制的内容', 'error');
                    return;
                }

                let text = '';
                this.processResults.forEach(result => {
                    text += `${result.content}\n`;
                });

                try {
                    await navigator.clipboard.writeText(text.trim());
                    this.showToast('已复制到剪贴板', 'success');
                } catch (err) {
                    // 降级方案
                    const textArea = document.createElement('textarea');
                    textArea.value = text.trim();
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textArea);
                    this.showToast('已复制到剪贴板', 'success');
                }
            }

            showToast(message, type = 'info') {
                const toast = document.getElementById('toast');
                toast.textContent = message;
                toast.className = `toast ${type}`;
                toast.classList.add('show');
                
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 3000);
            }
        }

        // 初始化应用
        const qrReader = new QRReader();
    </script>
</body>
</html>
